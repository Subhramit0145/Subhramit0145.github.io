<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%">
<defs>
  <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#7C4DFF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8"/>
  </linearGradient>
  <linearGradient id="barGlow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00E5FF"/>
    <stop offset="50%" stop-color="#A78BFA"/>
    <stop offset="100%" stop-color="#00E5FF"/>
  </linearGradient>
</defs>
<style>
  text { font-family: "JetBrains Mono", Consolas, Menlo, monospace; }
  .ft-text { font-size: 13px; font-weight: 700; letter-spacing: 4px; fill: url(#barGlow); }
  .ft-sub { font-size: 10px; fill: #6E7681; letter-spacing: 2px; }
</style>

<rect width="900" height="80" rx="12" fill="#070714" stroke="#1f2338" stroke-width="1.2"/>

<!-- Top glowing neon line with traveling animation -->
<rect x="0" y="0" width="900" height="2" fill="url(#footerGrad)"/>

<!-- Center text -->
<text class="ft-text" x="450" y="38" text-anchor="middle">SEE YOU IN THE COMMITS</text>
<text class="ft-sub" x="450" y="58" text-anchor="middle">// BRIDGING SILICON ARCHITECTURE &amp; AUTONOMOUS AI AGENTS</text>
</svg>